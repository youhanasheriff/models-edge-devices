name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Byte-compile only: catches syntax errors without installing the heavy
      # ML dependencies (torch, ultralytics, unsloth, ...).
      - name: Byte-compile Python sources
        run: python -m compileall -q launch_fiftyone.py verify_fiftyone.py llm vision orchestration

      - name: Install ruff
        run: python -m pip install ruff

      # Informational for now: the existing code base has some lint findings.
      - name: Ruff check (informational)
        continue-on-error: true
        run: ruff check .
